<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offers — CASA DECOR Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>

<body class="admin" data-admin-page="offers">
  <div class="adminLayout">
    <aside id="adminSidebar"></aside>

    <div class="adminMain">
      <header id="adminTopbar"></header>

      <main class="adminContent">
        <div class="pageHead">
          <div>
            <h1>Offers & Countdowns</h1>
            <p class="muted">Manage global offers (optional) and time windows. Product sales are handled in Product Editor.</p>
          </div>
          <div class="pageHead__actions">
            <button class="btn btn--primary" type="button" data-open-editor>Add Offer</button>
          </div>
        </div>

        <section class="panel">
          <div class="panelHead panelHead--stack">
            <div class="filters">
              <div class="field">
                <label for="q">Search</label>
                <input id="q" type="search" placeholder="Search offers…" />
              </div>
              <div class="field">
                <label for="state">State</label>
                <select id="state">
                  <option value="">All</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="panelHead__meta">
              <button class="btn btn--secondary" type="button" data-refresh>Refresh</button>
            </div>
          </div>

          <div class="panelBody">
            <div class="tableWrap">
              <table class="table" aria-label="Offers table">
                <thead>
                  <tr>
                    <th style="width:30%">Title</th>
                    <th>Discount</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Active</th>
                    <th style="width:22%">Actions</th>
                  </tr>
                </thead>
                <tbody data-offers-tbody>
                  <tr><td colspan="6" class="muted">Loading…</td></tr>
                </tbody>
              </table>
            </div>

            <div class="notice notice--error" data-error hidden></div>
            <div class="notice notice--info" data-empty hidden>No offers found.</div>
          </div>
        </section>

        <!-- Offer editor drawer -->
        <section class="drawer" data-drawer hidden>
          <div class="drawer__backdrop" data-drawer-close></div>
          <div class="drawer__panel drawer__panel--admin" role="dialog" aria-modal="true" aria-label="Offer editor">
            <div class="drawer__header">
              <div class="drawer__title" data-editor-title>Offer</div>
              <button class="iconBtn" type="button" data-drawer-close aria-label="Close">
                <span aria-hidden="true">×</span>
              </button>
            </div>

            <form class="form" id="offerForm">
              <input type="hidden" id="offerId" />

              <div class="field">
                <label for="title">Title *</label>
                <input id="title" required />
              </div>

              <div class="field">
                <label for="description">Description</label>
                <textarea id="description" rows="3"></textarea>
              </div>

              <div class="formGrid">
                <div class="field">
                  <label for="discount_type">Discount type</label>
                  <select id="discount_type">
                    <option value="percentage">Percentage</option>
                    <option value="fixed">Fixed</option>
                  </select>
                </div>

                <div class="field">
                  <label for="discount_value">Discount value</label>
                  <input id="discount_value" type="number" min="0" step="1" />
                </div>

                <div class="field">
                  <label for="start_at">Start</label>
                  <input id="start_at" type="datetime-local" />
                </div>

                <div class="field">
                  <label for="end_at">End</label>
                  <input id="end_at" type="datetime-local" />
                </div>

                <div class="field field--inline">
                  <label class="check">
                    <input id="active" type="checkbox" />
                    <span>Active</span>
                  </label>
                </div>
              </div>

              <div class="row">
                <button class="btn btn--primary" type="submit">Save</button>
                <button class="btn btn--danger" type="button" data-delete hidden>Delete</button>
              </div>

              <div class="notice notice--error" data-form-error hidden></div>
              <div class="notice notice--success" data-form-saved hidden>Saved.</div>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" data-modal hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Confirm action">
      <div class="modal__head">
        <div class="modal__title" data-modal-title>Confirm</div>
        <button class="iconBtn" type="button" data-modal-close aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal__body" data-modal-body></div>
      <div class="modal__foot">
        <button class="btn btn--secondary" type="button" data-modal-cancel>Cancel</button>
        <button class="btn btn--danger" type="button" data-modal-confirm>Confirm</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="adminToastMount" aria-live="polite"></div>

  <script type="module" src="../assets/js/admin.js"></script>
  <script type="module" src="../assets/js/offers-admin.js"></script>
</body>
</html>
