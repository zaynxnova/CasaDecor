<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categories — CASA DECOR Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>

<body class="admin" data-admin-page="categories">
  <div class="adminLayout">
    <aside id="adminSidebar"></aside>

    <div class="adminMain">
      <header id="adminTopbar"></header>

      <main class="adminContent">
        <div class="pageHead">
          <div>
            <h1>Categories</h1>
            <p class="muted">Manage collection categories and their images.</p>
          </div>
          <div class="pageHead__actions">
            <button class="btn btn--primary" type="button" data-open-editor>Add Category</button>
          </div>
        </div>

        <section class="panel">
          <div class="panelHead panelHead--stack">
            <div class="filters">
              <div class="field">
                <label for="q">Search</label>
                <input id="q" type="search" placeholder="Search categories…" />
              </div>
            </div>
            <div class="panelHead__meta">
              <button class="btn btn--secondary" type="button" data-refresh>Refresh</button>
            </div>
          </div>

          <div class="panelBody">
            <div class="tableWrap">
              <table class="table" aria-label="Categories table">
                <thead>
                  <tr>
                    <th style="width:34%">Category</th>
                    <th>Slug</th>
                    <th>Hidden</th>
                    <th>Sort</th>
                    <th style="width:24%">Actions</th>
                  </tr>
                </thead>
                <tbody data-categories-tbody>
                  <tr><td colspan="5" class="muted">Loading…</td></tr>
                </tbody>
              </table>
            </div>

            <div class="notice notice--error" data-error hidden></div>
            <div class="notice notice--info" data-empty hidden>No categories found.</div>
          </div>
        </section>

        <!-- Editor drawer -->
        <section class="drawer" data-drawer hidden>
          <div class="drawer__backdrop" data-drawer-close></div>
          <div class="drawer__panel drawer__panel--admin" role="dialog" aria-modal="true" aria-label="Category editor">
            <div class="drawer__header">
              <div class="drawer__title" data-editor-title>Category</div>
              <button class="iconBtn" type="button" data-drawer-close aria-label="Close">
                <span aria-hidden="true">×</span>
              </button>
            </div>

            <form class="form" id="categoryForm">
              <input type="hidden" id="catId" />

              <div class="field">
                <label for="name">Name *</label>
                <input id="name" required />
              </div>

              <div class="field">
                <label for="slug">Slug *</label>
                <div class="inputRow">
                  <input id="slug" required />
                  <button class="btn btn--secondary btn--sm" type="button" data-slugify>Generate</button>
                </div>
              </div>

              <div class="field">
                <label for="description">Description</label>
                <textarea id="description" rows="3"></textarea>
              </div>

              <div class="field">
                <label for="sort_order">Sort order</label>
                <input id="sort_order" type="number" step="1" />
              </div>

              <div class="field field--inline">
                <label class="check">
                  <input id="hidden" type="checkbox" />
                  <span>Hidden</span>
                </label>
              </div>

              <div class="uploadBox">
                <label class="muted small">Image (optional)</label>
                <input id="imageInput" type="file" accept="image/*" />
                <button class="btn btn--secondary" type="button" data-upload>Upload image</button>
                <div class="help muted">Stored in Supabase Storage and linked via <code>image_path</code>.</div>
              </div>

              <div class="imagePreview" data-image-preview hidden>
                <img alt="Category image preview" />
                <button class="btn btn--danger btn--sm" type="button" data-remove-image>Remove image</button>
              </div>

              <div class="row">
                <button class="btn btn--primary" type="submit">Save</button>
                <button class="btn btn--danger" type="button" data-delete hidden>Delete</button>
              </div>

              <div class="notice notice--error" data-form-error hidden></div>
              <div class="notice notice--success" data-form-saved hidden>Saved.</div>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" data-modal hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Confirm action">
      <div class="modal__head">
        <div class="modal__title" data-modal-title>Confirm</div>
        <button class="iconBtn" type="button" data-modal-close aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal__body" data-modal-body></div>
      <div class="modal__foot">
        <button class="btn btn--secondary" type="button" data-modal-cancel>Cancel</button>
        <button class="btn btn--danger" type="button" data-modal-confirm>Confirm</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="adminToastMount" aria-live="polite"></div>

  <script type="module" src="../assets/js/admin.js"></script>
  <script type="module" src="../assets/js/categories-admin.js"></script>
</body>
</html>
